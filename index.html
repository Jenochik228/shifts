<!doctype html>
<html lang="ru" data-theme="light" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Смены">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Мои смены</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;700&display=swap">
<script>
// применяем тему до отрисовки, чтобы не было вспышки
(function(){try{
  var m=localStorage.getItem('shiftcal.theme')||'auto';
  var d=m==='auto'?matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light':m;
  document.documentElement.dataset.mode=m;document.documentElement.dataset.theme=d;
}catch(e){}})();
</script>
<style>
:root{
  --bg:#f4f5f9;--bg2:#eceef5;--card:#ffffff;--text:#151a27;--muted:#7b8397;--line:#e5e8f0;
  --accent:#4f6bff;--accent-soft:rgba(79,107,255,.12);--shadow:0 1px 2px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.06);
  --radius:16px;color-scheme:light;
  --ds:clamp(30px,10.5vw,42px);   /* размер круга дня */
  --f-soft:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme=dark]{
  --bg:#0e1118;--bg2:#141822;--card:#181d29;--text:#eaedf5;--muted:#8a93a8;--line:#262d3d;
  --accent:#7b93ff;--accent-soft:rgba(123,147,255,.16);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(1200px 500px at 80% -10%,var(--accent-soft),transparent 60%),var(--bg)}
body:has(dialog[open]){overflow:hidden}
.wrap{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* анимация смены темы */
/* смена темы — круговое раскрытие; остальные изменения (язык, панели, расчёты) — мягкое перетекание */
::view-transition-old(root),::view-transition-new(root){mix-blend-mode:normal}
html[data-vt=theme]::view-transition-old(root),html[data-vt=theme]::view-transition-new(root){animation:none}
html[data-vt=theme]::view-transition-old(root){z-index:1}html[data-vt=theme]::view-transition-new(root){z-index:2}
html[data-vt=fade]::view-transition-old(root){animation:vtOut .24s ease both}
html[data-vt=fade]::view-transition-new(root){animation:vtIn .24s ease both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0}}
.theming,.theming *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,box-shadow .45s ease!important}

header{display:flex;align-items:flex-end;gap:8px;margin:2px 0 6px;flex:none}
header .nav{display:flex;gap:8px;align-items:center}
header button.icon{border-radius:50%;box-shadow:var(--shadow)}
.ttl{margin-right:auto;min-width:0}
.ttl small{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}
h1{font:700 32px/1.1 var(--f-soft);letter-spacing:-.02em;margin:0;text-transform:capitalize;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{display:flex;align-items:center;gap:18px;margin:0 2px 12px;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#sum{display:flex;gap:18px;min-width:0}
#sum span{display:block}
#sum b{display:block;font:700 20px/1.2 var(--f-soft);color:var(--text)}
#todayBtn{margin-left:auto;border-radius:999px;padding:6px 14px;font-size:13px;box-shadow:var(--shadow)}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;
  transition:transform .12s,border-color .2s,background .2s,box-shadow .2s,opacity .2s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;pointer-events:none}
button.icon{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px var(--accent-soft)}
button.danger{color:#ef4444}
button.ghost{background:transparent}
.muted{color:var(--muted);font-size:13px}

/* календарь */
.calwrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:26px;padding:12px 6px 10px;box-shadow:var(--shadow);touch-action:pan-y;overflow:hidden}
#dow,.pn{display:grid;grid-template-columns:16px repeat(7,minmax(0,1fr))}
#dow{flex:none;padding-bottom:6px;font-size:11px;font-weight:500;color:var(--muted);text-align:center;text-transform:capitalize}
#vp{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y}
#track{flex:1;min-height:0;display:flex;width:100%;transform:translate3d(-100%,0,0);will-change:transform;backface-visibility:hidden}
.pn{flex:0 0 100%;min-width:0;grid-auto-rows:minmax(0,1fr);align-items:center;justify-items:center}
.lg{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 10px 0;font-size:11px;color:var(--muted)}
.lg:empty{display:none}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg i.off{background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 2px var(--c)}
label.btn{display:inline-flex;align-items:center;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:border-color .2s}
label.btn:hover{border-color:var(--accent)}
label.btn input{display:none}
/* день — круг: смена закрашена цветом, выходной — пустое кольцо, автосмена — пунктир */
.wn{font-size:9px;color:color-mix(in srgb,var(--muted) 70%,transparent);font-variant-numeric:tabular-nums}
.dc{width:100%;height:100%;min-height:0;display:grid;place-items:center;cursor:pointer;user-select:none}
.disc{--c:transparent;--ink:var(--text);position:relative;width:var(--ds);height:var(--ds);border-radius:50%;display:grid;place-items:center;
  font:500 13px var(--f-soft);color:var(--text);font-variant-numeric:tabular-nums;transition:transform .12s}
.dc:active .disc{transform:scale(.9)}
.disc.on{background:var(--c);color:var(--ink)}
.disc.off{background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 2px var(--c);color:var(--text)}
.disc.auto{background:transparent;color:var(--c);border:1.5px dashed var(--c)}
.dc.other{opacity:.3}
.dc.today .disc::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--text)}
.ob{position:absolute;right:-4px;top:-4px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;display:grid;place-items:center;
  font:700 8.5px var(--f-soft);color:#fff;text-decoration:none;box-shadow:0 0 0 2px var(--card)}
.nt{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}
.hl{position:absolute;left:1px;top:1px;width:7px;height:7px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 1.5px var(--card)}
.hnote{margin:-6px 0 12px;font-size:13px;color:#e5484d;font-weight:500}
/* инструкция для новых пользователей */
.hart{--ds:34px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;min-height:84px;margin:10px 0 16px;padding:16px;background:var(--bg2);border-radius:24px}
.hart .disc{font-size:12px}
.hart img{width:68px;height:68px;border-radius:20px;box-shadow:var(--shadow)}
.hart .arr{color:var(--muted);font-size:18px;padding:0 2px}
.btnlike{padding:8px 14px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:13px}
.htitle{font:700 22px/1.2 var(--f-soft);margin:0 0 8px;letter-spacing:-.01em}
.hbody{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
.hbody b{color:var(--text)}
.hdots{display:flex;justify-content:center;gap:6px;margin:18px 0 0}
.hdots i{width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--muted) 35%,transparent);transition:width .3s,background .3s}
.hdots i.on{width:20px;border-radius:999px;background:var(--accent)}
.hlang{display:flex;justify-content:flex-end}
/* шторка выбора категории: выезжает снизу, закрывается тем же жестом */
dialog.sheet{width:100%;max-width:520px;margin:auto auto 0;border-radius:28px 28px 0 0;max-height:88vh;max-height:88dvh}
dialog.sheet[open]{animation:sheetIn .36s cubic-bezier(.2,.9,.3,1)}
dialog.sheet.closing{animation:sheetOut .24s ease forwards}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
.sheet .dlg{padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh}
.grab{width:44px;height:5px;border-radius:999px;background:color-mix(in srgb,var(--muted) 45%,transparent);margin:-6px auto 12px}
.sheetfoot{justify-content:space-between}
.sheetfoot .danger{margin-right:0}
.catpick .lcode{background:var(--c);color:#fff}
.catpick{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
/* меню: список разделов */
.navlist{display:flex;flex-direction:column;gap:6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:22px}
.nav .nm{flex:1;min-width:0;font-weight:600}
.mic{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);font-size:18px}
/* окно выбора языка */
.langlist{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:22px}
.lcode{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 12px var(--f-soft);letter-spacing:.02em}
.lname{flex:1;min-width:0}
.lname b{display:block;font-size:15px}
.lname small{color:var(--muted);font-size:12px}
.lck{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;background:var(--accent);opacity:0;transform:scale(.4);transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.lrow.on{border-color:var(--accent);background:var(--accent-soft)}
.lrow.on .lck{opacity:1;transform:none}
/* зарплата */
.payopt{display:block;width:100%;text-align:left;padding:14px 18px;border-radius:24px;margin-bottom:8px}
.payopt b{display:block;font-size:15px;margin-bottom:2px}
.payopt small{display:block;color:var(--muted);font-size:12px;line-height:1.35;white-space:normal}
.payopt.skip{background:transparent}
.paymon{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;text-transform:capitalize;font-weight:600}
.paybig{background:var(--accent-soft);border-radius:24px;padding:14px 18px;margin-bottom:12px}
.paybig small{display:block;color:var(--muted);font-size:12px}
.paybig b{display:block;font:700 34px/1.15 var(--f-soft);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pr{display:flex;justify-content:space-between;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.pr small{color:var(--muted);font-size:12px}
.pr b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr.tot{font-weight:700;border-bottom:0}
.pr.neg b{color:#e5484d}
.paydet{margin-top:14px;background:var(--bg2);border-radius:24px;padding:4px 16px 16px}
.paydet summary{cursor:pointer;padding:12px 0;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.bonus{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.bonus input[type=text]{flex:1 1 100%;min-width:0}
.bonus input[type=number]{width:96px;min-width:0}
.bonus select{flex:1;min-width:0}
/* остатки на главном экране */
.pills{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 2px 10px;flex:none}
.pills:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;box-shadow:var(--shadow)}
.pill i{width:9px;height:9px;border-radius:50%;flex:none}
.pill b{font:700 15px var(--f-soft);font-variant-numeric:tabular-nums}
.pill span{color:var(--muted);font-size:12px}
.pill.over b{color:#e5484d}
/* остатки и переключатель */
.bal{background:var(--bg2);border-radius:20px;padding:10px 12px;margin-bottom:8px}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bh .nm{flex:1;min-width:0;font-weight:600}
.bh .dot{display:grid;place-items:center;min-width:30px;height:30px;border-radius:999px;color:#fff;font-weight:700;font-size:13px;padding:0 4px}
.bbar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--muted) 25%,transparent);overflow:hidden;margin-bottom:6px}
.bbar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.hrow{display:flex;align-items:center;gap:12px}.hrow>div{flex:1;min-width:0}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,var(--muted) 40%,transparent);transition:background .2s;cursor:pointer}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:disabled+span{opacity:.4;cursor:default}
/* нижняя плашка */
.bar{flex:none;margin-top:12px;background:var(--text);color:var(--bg);border-radius:999px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(20,25,45,.28)}
.bar .bd{width:26px;height:26px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--bg) 35%,var(--text))}
.bar div{flex:1;min-width:0;font-size:13px;line-height:1.25;font-weight:500}
.bar small{display:block;font-size:11px;opacity:.65;font-weight:400}
.bar button{border:0;background:var(--bg);color:var(--text);border-radius:999px;font:500 12px var(--f-soft);padding:8px 14px}

/* всплывающие окна */
dialog{border:0;padding:0;border-radius:28px;background:var(--card);color:var(--text);box-shadow:0 24px 60px rgba(0,0,0,.35);
  width:calc(100% - 24px);max-width:520px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden}
dialog[open]{animation:dlgIn .28s cubic-bezier(.2,.9,.3,1.1)}
dialog.closing{animation:dlgOut .18s ease forwards}
dialog::backdrop{background:rgba(10,14,25,.5);backdrop-filter:blur(5px);animation:fade .25s}
dialog.closing::backdrop{animation:fade .18s reverse forwards}
@keyframes dlgIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes dlgOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fade{from{opacity:0}}
.dlg{padding:18px;overflow:auto;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overscroll-behavior:contain}
.dlg{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent}
.dlg::-webkit-scrollbar{width:8px}
.dlg::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 45%,transparent);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
.catlist button{border-radius:20px}
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dhead h2{margin:0 auto 0 0;font-size:18px;letter-spacing:-.01em;text-transform:capitalize}
.sec{margin-top:18px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:650}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cat{--c:#888;display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:20px;
  border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.cat:hover{border-color:var(--c)}
.cat b{display:grid;place-items:center;min-width:30px;height:30px;padding:0 4px;border-radius:999px;background:var(--c);color:#fff;font-size:13px}
.cat small{display:block;color:var(--muted);font-size:12px}
.cat.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c)}
.ovrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ovrow .cat{flex:1;min-width:130px;cursor:default}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{background:var(--bg2);border-radius:20px;padding:10px 12px}
.stat b{font-size:22px;letter-spacing:-.02em;display:block}
.stat.big{background:var(--accent-soft)}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted);
  transition:color .25s,background .25s,box-shadow .25s,transform .12s}
.seg button.on{color:var(--text);background:var(--card);box-shadow:var(--shadow)}

.catlist{display:flex;flex-direction:column;gap:6px}
.catlist button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:8px 12px}
.catlist .dot{display:grid;place-items:center;min-width:30px;height:30px;border-radius:999px;color:#fff;font-weight:700;font-size:13px;padding:0 4px}
.catlist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px 12px;transition:border-color .2s,background .3s}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
input:disabled{opacity:.6}
textarea{width:100%;resize:vertical;min-height:70px}
input[type=color]{padding:0;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);overflow:hidden;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
/* круглые флажки в общей стилистике */
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border-radius:50%;padding:0;cursor:pointer;
  border:2px solid color-mix(in srgb,var(--muted) 55%,transparent);background:transparent;display:inline-grid;place-items:center;transition:background .2s,border-color .2s}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
input[type=checkbox]:disabled{opacity:.5;cursor:default}
label.f{display:block;margin-top:12px}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
label.f input[type=text],label.f input[type=number]{width:100%}
label.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px}
label.chk small{display:block;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.swatches button{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid transparent}
.swatches button.on{border-color:var(--text)}
.foot{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.foot .danger{margin-right:auto}

/* уведомление с отменой */
#toast{position:fixed;top:auto;right:auto;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));margin:0;transform:translateX(-50%);
  display:none;align-items:center;gap:12px;padding:10px 10px 10px 16px;border:0;border-radius:24px;background:var(--text);color:var(--bg);
  box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px;z-index:50;width:max-content;max-width:calc(100% - 24px);overflow:visible}
#toast.on{display:flex;animation:tin .25s cubic-bezier(.2,.9,.3,1.1)}
#toast.on.out{animation:tout .22s ease forwards}
@keyframes tout{to{opacity:0;transform:translate(-50%,10px)}}
details[open]>:not(summary){animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(-4px)}}
#toast button{background:transparent;border:0;color:var(--accent);font-weight:700;padding:6px 10px}
:root[data-theme=dark] #toast button{color:#3b54e0}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- адаптация под телефон ---------- */
@media(max-width:700px){
  input,select,textarea{font-size:16px}          /* iOS не приближает страницу при фокусе */
}
@media(max-width:560px){
  .wrap{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  h1{font-size:28px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:28px 28px 0 0}
  .dlg{padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh}
  dialog{max-height:92vh;max-height:92dvh}
  @keyframes dlgIn{from{opacity:.6;transform:translateY(60px)}to{opacity:1;transform:none}}
  @keyframes dlgOut{to{opacity:0;transform:translateY(60px)}}
}
@media(max-width:420px){
  #sum{gap:14px}
  #sum b{font-size:18px}
  .cats{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:340px){
  h1{font-size:24px}
  .hs{gap:10px}#sum{gap:10px}
  .cats{grid-template-columns:1fr}
}
@media(pointer:coarse){
  button,label.btn{min-height:44px}
  button.icon{width:44px;height:44px}
  .seg button{min-height:38px}
  .swatches button{width:34px;height:34px;min-height:0}
}
/* телефон в горизонтальном положении */
@media(max-height:520px) and (orientation:landscape){
  .wrap{padding-top:max(8px,env(safe-area-inset-top))}
  header{margin-bottom:8px}
  h1{font-size:20px}
  button.icon{width:36px;height:36px}
  button{min-height:0}
  :root{--ds:28px}
  .hs,.pills{display:none}
  .bar{margin-top:6px;padding-block:6px}
  .lg{display:none}
  dialog{margin:auto;width:min(560px,calc(100% - 24px));border-radius:28px;max-height:94vh;max-height:94dvh}
  .dlg{max-height:94vh;max-height:94dvh}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let S;try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(DEF)}catch{S=structuredClone(DEF)}
function normalize(){
  if(!S.types.some(t=>t.overlay))S.types.push(structuredClone(DEF.types[5]));
  // новые стандартные категории добавляются один раз; удалённую пользователем второй раз не возвращаем
  S.seed=S.seed||[];
  if(!S.seed.includes('pg')){
    if(!S.types.some(t=>t.key==='pg'))S.types.push(structuredClone(DEF.types[6]));
    S.seed.push('pg');
  }
  // стандартные категории: имя и метка берутся из перевода, пока пользователь их не изменил
  for(const t of S.types){
    const ru=I18N.ru.types;
    if(!t.key&&ru[t.id])t.key=t.id;
    if(t.key&&ru[t.key]){
      if(t.name===ru[t.key][0])delete t.name;
      if(t.short===ru[t.key][1])delete t.short;
    }
  }
  const ot=S.types.find(t=>t.overlay).id;
  for(const k in S.days){const e=S.days[k];
    if('ot' in e){e.ov=e.ov||{};e.ov[ot]=e.ot;delete e.ot}
    if(e.ov&&!Object.keys(e.ov).length)delete e.ov;
  }
}

/* ---------- время смены ---------- */
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const span=(s,e)=>{let d=toMin(e)-toMin(s);if(d<=0)d+=1440;return Math.round(d/60*100)/100};   // ночная смена переходит через полночь
const times=(e,t)=>e.s&&e.e?[e.s,e.e]:t&&t.start&&t.end?[t.start,t.end]:null;
const r2=n=>Math.round(n*100)/100;
// обед вычитается из рабочих часов; для отпуска/больничного по умолчанию не вычитается
const lunchOf=t=>t.overlay?0:t.lunch!==undefined?+t.lunch||0:t.ignore?0:30;
const netOf=(g,t)=>g>0?Math.max(0,r2(g-lunchOf(t)/60)):0;
const dayHours=(e,t)=>{const x=times(e,t);return netOf(x?span(...x):+t.hours||0,t)};
const typeNet=t=>netOf(t.start&&t.end?span(t.start,t.end):+t.hours||0,t);
const shortT=s=>s.endsWith(':00')?String(+s.slice(0,2)):s;

// Плавное изменение интерфейса: перетекание старого вида в новый (View Transitions),
// а там, где браузер этого не умеет, — быстрое затухание указанного блока.
const reduceMotion=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function smooth(fn,fallbackEl){
  const r=document.documentElement;
  if(r.dataset.vt||reduceMotion()){fn();return}
  if(document.startViewTransition){
    r.dataset.vt='fade';
    const t=document.startViewTransition(()=>{fn()});
    t.finished.finally(()=>{delete r.dataset.vt});
    return;
  }
  if(fallbackEl){
    fallbackEl.style.transition='opacity .12s';fallbackEl.style.opacity='0';
    setTimeout(()=>{fn();fallbackEl.style.opacity='1'},120);
    return;
  }
  fn();
}
function setLang(l){
  LANG=l;try{localStorage.setItem(LK,l)}catch{}
  smooth(()=>{
    applyStatic();render();
    if($('menuDlg').open)renderMenuNow();
    if($('dayDlg').open)renderDayNow();
    if($('payDlg').open)renderPayNow();
    if($('helpDlg').open)renderHelpNow();
    if($('langDlg').open)renderLangNow();
  },document.querySelector('.wrap'));
}

/* ---------- отмена ---------- */
const hist=[];
function snap(){hist.push(JSON.stringify(S));if(hist.length>50)hist.shift()}
function undo(){
  if(!hist.length)return;
  const prev=hist.pop();
  smooth(()=>{
    S=JSON.parse(prev);normalize();save();render();
    if($('typeDlg').open)closeDlg($('typeDlg'));
    if($('dayDlg').open)renderDayNow();
    if($('menuDlg').open)renderMenuNow();
    if($('payDlg').open&&S.pay)renderPayNow();
  },document.querySelector('.wrap'));
  toast(tr('undone'),false);
}
let tt;
function toast(msg,canUndo=true,ms=4500){
  const T=$('toast');$('tmsg').textContent=msg;
  $('tundo').hidden=!(canUndo&&hist.length);
  T.classList.add('on');
  if(T.showPopover&&!T.matches(':popover-open'))T.showPopover();   // поверх открытых окон
  clearTimeout(tt);
  T.classList.remove('out');
  tt=setTimeout(()=>{
    T.classList.add('out');   // сначала плавно гаснет, потом убирается
    setTimeout(()=>{T.classList.remove('on','out');if(T.hidePopover&&T.matches(':popover-open'))T.hidePopover()},reduceMotion()?0:220);
  },ms);
}
function done(msg){save();smooth(render,$('cal'));toast(msg)}

/* ---------- тема ---------- */
const mq=matchMedia('(prefers-color-scheme:dark)');
const resolve=m=>m==='auto'?(mq.matches?'dark':'light'):m;
function paintTheme(m){
  const r=document.documentElement;r.dataset.mode=m;r.dataset.theme=resolve(m);
  document.querySelector('meta[name=theme-color]').content=r.dataset.theme==='dark'?'#0e1118':'#f4f5f9';
  document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
}
function setTheme(m,ev){
  try{localStorage.setItem(TK,m)}catch{}
  const same=resolve(m)===document.documentElement.dataset.theme;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(same||reduce){paintTheme(m);return}
  if(document.startViewTransition&&ev){
    const x=ev.clientX,y=ev.clientY;
    const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    const root=document.documentElement;root.dataset.vt='theme';
    const vt=document.startViewTransition(()=>paintTheme(m));
    vt.finished.finally(()=>{delete root.dataset.vt});
    vt.ready.then(()=>
      root.animate(
        {clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},
        {duration:650,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'}));
  }else{
    const r=document.documentElement;r.classList.add('theming');paintTheme(m);
    setTimeout(()=>r.classList.remove('theming'),500);
  }
}
mq.onchange=()=>{if(document.documentElement.dataset.mode==='auto')paintTheme('auto')};

// Пасха: западная (григорианская) и православная (юлианская + 13 дней)
const easterW=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  return new Date(y,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1)};
const easterO=y=>{const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;
  return new Date(y,Math.floor((d+e+114)/31)-1,((d+e+114)%31)+1+13)};
const hcache={};

function holidaysFor(c,y){   // для расчётов: страна задана явно
  const ck=`${c}${y}`;if(hcache[ck])return hcache[ck];
  const D=HDATA[c],out={};
  for(const[md,name]of Object.entries(D.fixed))out[`${y}-${md}`]=name;
  const e=D.west?easterW(y):easterO(y);
  for(const[off,name]of Object.entries(D.easter))out[fmt(new Date(e.getFullYear(),e.getMonth(),e.getDate()+ +off))]=name;
  return hcache[ck]=out;
}

const nf=n=>String(r2(n)).replace('.',',');
function isoWeek(dt){
  const t=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7);
}
// выходной: рабочая категория без часов и времени (рисуется пустым кольцом)
const isOff=t=>!t.overlay&&!t.ignore&&!t.start&&!(+t.hours>0);
// читаемый цвет цифры на цветном круге
function inkOn(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex))return '#fff';
  const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  return .299*r+.587*g+.114*b>170?'#2a1e00':'#fff';
}

// Месяц: недели строками, слева номер недели, день — круг цвета смены.
function gridHtml(m){
  const y=m.getFullYear(),mo=m.getMonth(),lead=(new Date(y,mo,1).getDay()+6)%7;
  const cells=Math.ceil((lead+new Date(y,mo+1,0).getDate())/7)*7;
  const today=fmt(new Date());let h='';
  for(let i=0;i<cells;i++){
    const d=new Date(y,mo,1-lead+i);
    if(i%7===0)h+=`<span class="wn">${isoWeek(d)}</span>`;
    const k=fmt(d),e=S.days[k]||{},t=e.t&&type(e.t),other=d.getMonth()!==mo;
    let cls='disc',st='';
    if(t&&!t.overlay){cls+=isOff(t)?' off':e.auto?' on auto':' on';st=` style="--c:${t.color};--ink:${inkOn(t.color)}"`}
    const ov=Object.entries(e.ov||{}).filter(([id])=>type(id));
    const ob=ov.length?`<u class="ob" style="background:${type(ov[0][0]).color}">+${nf(ov.reduce((a,[,v])=>a+(+v||0),0))}</u>`:'';
    const hn=holidayOf(k);
    h+=`<div class="dc${other?' other':''}${k===today?' today':''}" data-k="${k}"${hn?` title="${esc(hn)}"`:''}><span class="${cls}"${st}>${d.getDate()}${ob}${e.note?'<i class="nt"></i>':''}${hn?'<i class="hl"></i>':''}</span></div>`;
  }
  return h;
}
function monthTotals(m){
  const ym=`${m.getFullYear()}-${pad(m.getMonth()+1)}`;let h=0,s=0,o=0;
  for(const[k,e]of Object.entries(S.days)){
    if(!k.startsWith(ym))continue;
    const t=e.t&&type(e.t);
    if(t&&!t.overlay){const x=dayHours(e,t);h+=x;if(x>0)s++;if(isOff(t))o++}
    for(const v of Object.values(e.ov||{}))h+=+v||0;
  }
  return{h,s,o};
}

  for(const[k,e]of Object.entries(S.days))if(k.startsWith(ym)){if(e.t)used.add(e.t);for(const id of Object.keys(e.ov||{}))used.add(id)}

  $('lg').innerHTML=S.types.filter(t=>used.has(t.id)).map(t=>`<span><i${isOff(t)?` class="off" style="--c:${t.color}"`:` style="background:${t.color}"`}></i>${esc(nm(t))}</span>`).join('')
    +(hasHol?`<span><i style="background:#e5484d"></i>${tr('holiday')}</span>`:'');
  renderBar();renderPills();

let busy=false;
const EASE='cubic-bezier(.22,.85,.3,1)';
// dir: +1 следующий месяц, -1 предыдущий, 0 — вернуться на место
function slide(dir,ms,commit){
  busy=true;let fin=false;
  const end=()=>{
    if(fin)return;fin=true;track.removeEventListener('transitionend',onEnd);
    if(dir)commit();
    render();busy=false;
  };
  const onEnd=e=>{if(e.target===track&&e.propertyName==='transform')end()};
  track.addEventListener('transitionend',onEnd);
  setTimeout(end,ms+90);                       // запасной вариант, если transitionend не придёт
  track.style.transition=`transform ${ms}ms ${EASE}`;
  track.style.transform=`translate3d(${-100*(1+dir)}%,0,0)`;
}
function goMonth(dir,target){
  if(busy)return;
  if(target)track.children[dir>0?2:0].innerHTML=gridHtml(target);   // далёкий переход (например «Сегодня»)
  slide(dir,300,()=>{cur=target?new Date(target):monthAt(dir)});
}

// свайп: календарь следует за пальцем
let drag=null;
vp.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||busy)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,on:false,dx:0,raf:0,pts:[]};
});
vp.addEventListener('pointermove',e=>{
  const d=drag;if(!d||e.pointerId!==d.id)return;
  const dx=e.clientX-d.x,dy=e.clientY-d.y;
  if(!d.on){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){
      d.on=true;d.x=e.clientX;track.style.transition='none';
      try{vp.setPointerCapture(e.pointerId)}catch{}
    }else{if(Math.abs(dy)>10)drag=null;return}
  }
  d.dx=e.clientX-d.x;
  const now=performance.now();d.pts.push([now,e.clientX]);
  while(d.pts.length>2&&now-d.pts[0][0]>100)d.pts.shift();
  if(!d.raf)d.raf=requestAnimationFrame(()=>{d.raf=0;track.style.transform=`translate3d(calc(-100% + ${d.dx}px),0,0)`});
});
function endDrag(e,cancel){
  const d=drag;if(!d||e.pointerId!==d.id)return;
  drag=null;cancelAnimationFrame(d.raf);
  if(!d.on)return;
  track.style.transform=`translate3d(calc(-100% + ${d.dx}px),0,0)`;void track.offsetWidth;   // фиксируем текущую позицию
  const w=vp.clientWidth,p=d.pts,dt=p.length>1?p[p.length-1][0]-p[0][0]:0;
  const v=dt>0?(p[p.length-1][1]-p[0][1])/dt:0;                      // px/мс
  const go=!cancel&&d.dx&&(Math.abs(d.dx)>w*.25||(Math.abs(v)>.35&&Math.sign(v)===Math.sign(d.dx)));
  if(go){
    const dir=d.dx<0?1:-1,left=w-Math.abs(d.dx);
    const ms=Math.max(140,Math.min(320,left/Math.max(Math.abs(v),.8)));
    slide(dir,ms,()=>{cur=monthAt(dir)});
  }else slide(0,240);
}
vp.addEventListener('pointerup',e=>endDrag(e,false));
vp.addEventListener('pointercancel',e=>endDrag(e,true));

    if(t){hours+=dayHours(e,t);cnt[t.id]=(cnt[t.id]||0)+1}

      over[id]=(over[id]||0)+(+hh||0);
      const p=e.ovp&&e.ovp[id];
      if(p){per[id]=per[id]||{};per[id][p]=(per[id][p]||0)+(+hh||0)}
    }
  }
  const ovTotal=Object.values(over).reduce((a,b)=>a+b,0);
  const r=n=>Math.round(n*100)/100;
  return`<div class="stat big"><b>${r(hours+ovTotal)}</b><span class="muted">${tr('totalHours')}</span></div>`+
    S.types.filter(t=>t.overlay&&over[t.id]).map(t=>{const p=per[t.id]||{};
      const sub=Object.keys(PIC).filter(k=>p[k]).map(k=>`${PIC[k]} ${r(p[k])}`).join(' · ');
      return`<div class="stat"><b style="color:${t.color}">${r(over[t.id])}</b><span class="muted">${esc(nm(t))}, ${tr('h')}</span>${sub?`<span class="muted" style="display:block;font-size:12px">${sub}</span>`:''}</div>`}).join('')+
    S.types.filter(t=>cnt[t.id]).map(t=>`<div class="stat"><b style="color:${t.color}">${cnt[t.id]}</b><span class="muted">${esc(nm(t))}</span></div>`).join('');
}

// На телефоне — системное меню «Поделиться» (сохранить в Файлы/отправить), на компьютере — обычная загрузка.
async function saveFile(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&matchMedia('(pointer:coarse)').matches&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return}
    catch(err){if(err.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;
  $('menuBody').appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ---------- напоминания ---------- */
// Приложение без сервера не может само будить телефон, пока закрыто. Поэтому два способа:
// 1) напоминание при открытии приложения (и системное уведомление, если разрешено);
// 2) экспорт смен в календарь телефона (.ics) со встроенными сигналами — они работают всегда.
const RK='shiftcal.rem',RL='shiftcal.remlast';

// что напомнить про день k: смена (если включено) и nadčas с галочкой «Напомнить»
function reminderItems(k){
  const e=S.days[k];if(!e)return[];
  const out=[],t=e.t&&type(e.t);
  if(getRem().on&&isWork(t)){const tm=times(e,t);out.push(`${nm(t)}${tm?' '+tm[0]+'–'+tm[1]:''}`)}
  for(const[id,v]of Object.entries(e.ov||{}))if(e.ovr&&e.ovr[id]&&type(id))out.push(`${nm(type(id))} +${nf(v)} ${tr('h')}`);
  return out;
}
function notify(title,body,tag){

function checkReminders(){
  const now=new Date(),[hh,mm]=getRem().time.split(':').map(Number);
  if(now<new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm))return;   // ещё рано
  const k=fmt(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));
  let last;try{last=localStorage.getItem(RL)}catch{}
  if(last===k)return;
  const items=reminderItems(k);if(!items.length)return;
  try{localStorage.setItem(RL,k)}catch{}

// .ics: смены и nadčas с сигналом «накануне в заданное время»
const pad2=n=>String(n).padStart(2,'0');
const icsMin=m=>pad2(Math.floor(m/60))+pad2(m%60)+'00';
const icsDay=(k,add=0)=>{const d=parse(k);d.setDate(d.getDate()+add);return fmt(d).replace(/-/g,'')};
const icsEsc=s=>String(s).replace(/[\\;,]/g,c=>'\\'+c).replace(/\n/g,'\\n');
function buildIcs(){
  const R=getRem(),rm=toMin(R.time),today=fmt(new Date());
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const out=[];
  const add=(uid,sum,desc,k,sMin,eMin,alarmText)=>{
    const before=1440+sMin-rm;                  // минут от напоминания накануне до начала
    const L=['BEGIN:VEVENT',`UID:${uid}@shiftcal`,`DTSTAMP:${stamp}`,`SUMMARY:${icsEsc(sum)}`];
    if(desc)L.push(`DESCRIPTION:${icsEsc(desc)}`);
    if(sMin===null){L.push(`DTSTART;VALUE=DATE:${icsDay(k)}`,`DTEND;VALUE=DATE:${icsDay(k,1)}`)}
    else{
      const over=eMin>=1440;
      L.push(`DTSTART:${icsDay(k)}T${icsMin(sMin)}`,`DTEND:${icsDay(k,over||eMin<=sMin?1:0)}T${icsMin(over?eMin-1440:eMin)}`);
    }
    L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(alarmText)}`,`TRIGGER:-PT${sMin===null?1440-rm:before}M`,'END:VALARM','END:VEVENT');
    out.push(...L);
  };
  for(const k of Object.keys(S.days).sort()){
    if(k<today)continue;
    const e=S.days[k],t=e.t&&type(e.t),tm=t&&!t.overlay?times(e,t):null;
    if(R.on&&isWork(t)){
      const hrs=dayHours(e,t);
      add(`${k}-${t.id}`,nm(t),hrs?`${nf(hrs)} ${tr('h')}`:'',k,tm?toMin(tm[0]):null,tm?toMin(tm[1])+(toMin(tm[1])<=toMin(tm[0])?1440:0):0,tr('remTomorrow',{list:nm(t)+(tm?' '+tm[0]+'–'+tm[1]:'')}));
    }
    for(const[id,v]of Object.entries(e.ov||{})){
      const ty=type(id);if(!ty||!(e.ovr&&e.ovr[id]))continue;
      const h=+v||0,p=e.ovp&&e.ovp[id],night=p?p==='n':!!tm&&toMin(tm[1])<=toMin(tm[0]);
      let s=night?(tm?toMin(tm[0]):1140)-h*60:(tm?toMin(tm[1]):1140);
      s=Math.max(0,Math.min(1439,s));
      add(`${k}-ot-${id}`,`${nm(ty)} +${nf(h)} ${tr('h')}`,'',k,s,Math.min(1440,s+h*60),tr('remTomorrow',{list:`${nm(ty)} +${nf(h)} ${tr('h')}`}));
    }
  }
  if(!out.length)return null;
  return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ShiftCal//RU','CALSCALE:GREGORIAN',`X-WR-CALNAME:${icsEsc(tr('title'))}`,...out,'END:VCALENDAR'].join('\r\n');
}
async function exportIcs(){
  const ics=buildIcs();
  if(!ics){toast(tr('icsEmpty'),false);return}
  await saveFile(new Blob([ics],{type:'text/calendar'}),`shifts-${fmt(new Date())}.ics`);
}

/* ---------- анализ цикла ---------- */
function detect(){
  const real=Object.entries(S.days).filter(([k,e])=>!e.auto&&e.t&&type(e.t)&&!type(e.t).ignore)
    .map(([k,e])=>[dayNum(parse(k)),e.t]).sort((a,b)=>a[0]-b[0]);
  if(real.length<6)return null;
  const last=real[real.length-1][0],from=last-89;
  const m=new Map(real.filter(r=>r[0]>=from));
  const pts=[...m.keys()];
  for(let p=2;p<=14;p++){
    let ok=0,tot=0;
    for(const d of pts){if(m.has(d+p)){tot++;if(m.get(d+p)===m.get(d))ok++}}
    if(tot>=p&&ok/tot>=0.9){
      const votes=Array.from({length:p},()=>({}));
      for(const[d,t]of m){const r=((d%p)+p)%p;votes[r][t]=(votes[r][t]||0)+1}
      const pat=votes.map(v=>Object.entries(v).sort((a,b)=>b[1]-a[1])[0]?.[0]);
      if(pat.some(x=>!x))continue;
      return{p,pat,last,conf:ok/tot,n:m.size};
    }
  }
  return null;
}
function analysisText(){
  const r=detect();
  return r?esc(tr('found',{p:r.p,pat:r.pat.map(id=>sh(type(id))).join(' '),c:Math.round(r.conf*100),n:r.n})):tr('notEnough');
}
function generate(){
  const r=detect();if(!r){alert(tr('cantDetect'));return}
  snap();
  const end=new Date();end.setDate(1);end.setMonth(end.getMonth()+ +$('months').value+1);end.setDate(0);
  const endN=dayNum(end);
  for(let d=r.last+1;d<=endN;d++){
    const dt=new Date(d*864e5);const k=fmt(new Date(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()));
    const x=S.days[k]||{};if(x.t)continue;
    x.t=r.pat[((d%r.p)+r.p)%r.p];x.auto=true;S.days[k]=x;
  }
  done(tr('built'));closeDlg($('menuDlg'));
}

/* ---------- зарплата (Словакия) ---------- */
// Два типа оплаты: почасовая и оклад в месяц (hrubá mzda). Надбавки — в €/ч или в % от часовой ставки.
// Значения по умолчанию взяты из листов бригадника (июнь–август 2026, сходятся до цента): взносы 4 % + 3 % с базы «брутто − 200 €» (вниз),
// налог 19 % от «брутто − взносы». Вычет 200 € может быть не у всех фирм, поэтому есть «Настроить по расчётному листу».
const fx=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
const trunc2=n=>Math.floor(n*100+1e-6)/100;
function payDefaults(mode,v,ptype='hourly'){
  const E=x=>({v:x,unit:'€'});
  const c={mode,payType:ptype,rate:ptype==='hourly'?v:0,base:ptype==='monthly'?v:0,dayH:8,fund:{},otPct:0,vacH:8,pgH:4,avgNem:0,avgNah:0,nem1:25,nem2:55,calib:1,official:{},childBonus:0};
  return mode==='student'
    ?{...c,prem:{night:E(0),sat:E(2.63),sun:E(0),hol:E(0)},contrib:[['Starobné poistenie',4],['Invalidné poistenie',3]],deduct:200,taxRate:19,taxFree:0}
    :{...c,otPct:25,prem:{night:E(1.05),sat:E(2.63),sun:E(5.26),hol:E(5.26)},
      contrib:[['Zdravotné poistenie',4],['Nemocenské poistenie',1.4],['Starobné poistenie',4],['Invalidné poistenie',3],['Poistenie v nezamestnanosti',1]],
      deduct:0,taxRate:15,taxFree:479.48};
}
// приводит настройки старого формата к новому
function payFix(P){
  P.payType=P.payType||'hourly';P.base=+P.base||0;P.dayH=+P.dayH||8;P.fund=P.fund||{};P.official=P.official||{};P.bonus=P.bonus||[];P.extra=P.extra||{};
  for(const k of ['night','sat','sun','hol']){const x=P.prem[k];if(typeof x==='number')P.prem[k]={v:x,unit:'€'}}
  return P;
}
// фонд рабочего времени месяца: будни без праздников × часов в дне (можно задать вручную, как «Fond prac. doby» на листе)
function fundHours(ym,P){
  if(+P.fund[ym])return +P.fund[ym];
  const[y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate(),hol=holidaysFor('SK',y);let d=0;
  for(let i=1;i<=n;i++){const dt=new Date(y,m-1,i),w=dt.getDay();if(w>0&&w<6&&!hol[fmt(dt)])d++}
  return d*P.dayH;
}
// часы смены по группам: обычные, ночные (22:00–06:00), суббота, воскресенье, праздник (с учётом вычета обеда)
function bands(k,e,t){
  const x=times(e,t),net=dayHours(e,t),date=parse(k);
  const fl=[0,1].map(i=>{const d=new Date(date.getFullYear(),date.getMonth(),date.getDate()+i);
    return{hol:!!holidaysFor('SK',d.getFullYear())[fmt(d)],sat:d.getDay()===6,sun:d.getDay()===0}});
  const out={base:net,night:0,sat:0,sun:0,hol:0};
  if(!x){const f=fl[0];if(f.hol)out.hol=net;else if(f.sat)out.sat=net;else if(f.sun)out.sun=net;return out}
  const s=toMin(x[0]);let en=toMin(x[1]);if(en<=s)en+=1440;
  const f=en>s?net/((en-s)/60):0;
  const ov=(a,b)=>Math.max(0,Math.min(b,en)-Math.max(a,s))/60*f;
  out.night=ov(0,360)+ov(1320,1800)+ov(2760,3240);
  [0,1].forEach(i=>{const m=ov(i*1440,(i+1)*1440);if(fl[i].hol)out.hol+=m;else if(fl[i].sat)out.sat+=m;else if(fl[i].sun)out.sun+=m});
  return out;
}
// какой по счёту день подряд идёт больничный (для оплаты фирмой первых 10 дней)
function pnIndex(k){
  let n=1;const d=parse(k);
  for(;;){d.setDate(d.getDate()-1);const e=S.days[fmt(d)],t=e&&e.t&&type(e.t);if(t&&t.key==='s')n++;else return n}
}
function payCalc(ym,P){
  payFix(P);
  const C={shifts:0,hours:0,night:0,sat:0,sun:0,hol:0,ot:0,vacDays:0,pgH:0,pgDays:0,pnDays:0,pnAll:0,pnRaw:0};
  const monthly=P.payType==='monthly',st=P.mode==='student';
  C.fund=monthly?fundHours(ym,P):0;
  C.hr=monthly?(C.fund?P.base/C.fund:0):P.rate;                 // часовая ставка (для оклада — оклад ÷ фонд часов)
  const avgNah=P.avgNah||C.hr,avgNem=P.avgNem||C.hr;
  for(const[k,e]of Object.entries(S.days)){
    if(!k.startsWith(ym))continue;
    const t=e.t&&type(e.t);
    if(t&&!t.overlay){
      if(isWork(t)){const b=bands(k,e,t);C.shifts++;C.hours+=b.base;C.night+=b.night;C.sat+=b.sat;C.sun+=b.sun;C.hol+=b.hol}
      else if(t.key==='v')C.vacDays++;
      else if(t.key==='pg'){C.pgDays++;C.pgH+=dayHours(e,t)||P.pgH}
      else if(t.key==='s'){C.pnAll++;const n=pnIndex(k);if(n<=10){C.pnDays++;C.pnRaw+=avgNem*P.vacH*(n<=3?P.nem1:P.nem2)/100}}
    }
    for(const v of Object.values(e.ov||{}))C.ot+=+v||0;
  }
  // оклад уменьшается на часы отсутствия (отпуск, Paragraf, PN); их оплата идёт отдельными строками
  C.absH=monthly?C.vacDays*P.vacH+C.pgH+C.pnAll*P.vacH:0;
  C.basePay=monthly?r2(P.base*(C.fund?Math.max(0,1-C.absH/C.fund):1)):r2(C.hours*P.rate);
  // надбавки фирма округляет вниз (по листу за июнь: 15,5 ч × 2,63 = 40,765 → 40,76)
  const pa=(h,pr)=>trunc2(h*(pr.unit==='%'?C.hr*pr.v/100:pr.v));
  C.prem={night:pa(C.night,P.prem.night),sat:pa(C.sat,P.prem.sat),sun:pa(C.sun,P.prem.sun),hol:pa(C.hol,P.prem.hol)};
  C.otPay=r2(C.ot*C.hr*(1+P.otPct/100));
  C.vacPay=st?0:r2(C.vacDays*P.vacH*avgNah);
  C.pgPay=st?0:r2(C.pgH*avgNah);
  C.pnPay=st?0:r2(C.pnRaw);
  // бонусы: фиксированная сумма, % от оклада (оплаты за часы), € за час, € за смену; плюс разовая премия месяца. Входят в брутто.
  C.bonuses=P.bonus.map(b=>{
    const v=+b.v||0;
    const a=b.u==='%'?C.basePay*v/100:b.u==='€/h'?C.hours*v:b.u==='€/s'?C.shifts*v:v;
    return{n:b.n||'',u:b.u||'€',v,a:r2(a)};
  });
  C.extra=r2(+P.extra[ym]||0);
  C.bonusTot=r2(C.bonuses.reduce((a,b)=>a+b.a,0)+C.extra);
  C.gross=r2(C.basePay+C.prem.night+C.prem.sat+C.prem.sun+C.prem.hol+C.otPay+C.vacPay+C.pgPay+C.pnPay+C.bonusTot);
  const base=Math.max(0,C.gross-P.deduct);
  C.contribs=P.contrib.map(([n,p])=>[n,p,trunc2(base*p/100)]);
  C.cTot=r2(C.contribs.reduce((a,c)=>a+c[2],0));
  C.tax=r2(Math.max(0,Math.round(Math.max(0,C.gross-C.cTot-P.taxFree)*P.taxRate)/100-P.childBonus));
  C.net0=r2(C.gross-C.cTot-C.tax);
  C.net=r2(C.net0*P.calib);
  return C;
}
// по числам с расчётного листа находит вычет из базы взносов, общий процент взносов и ставку налога
function learnFromSlip(g,b,o,t,nc,P){
  const out={};
  if(!(g>0))return out;
  const base=b>0?b:g;
  out.deduct=Math.max(0,r2(g-base));
  if(o>0){
    const rate=o/base*100,cur=P.contrib.reduce((a,c)=>a+c[1],0);
    out.contribRate=Math.round(rate*100)/100;out.keepContrib=Math.abs(rate-cur)<0.06;
  }
  const free=nc>0?nc:P.taxFree;if(nc>0)out.taxFree=nc;
  if(t>0){
    const taxable=g-(o>0?o:0)-free;
    if(taxable>0){const r=t/taxable*100,std=[15,19,25].find(x=>Math.abs(r-x)<0.4);out.taxRate=std??Math.round(r*100)/100}
  }
  return out;
}

  const g1=`<label class="f"><span>${tr('payTypeLbl')}</span><select data-pf="payType" data-str><option value="hourly"${monthly?'':' selected'}>${tr('payTypeHourly')}</option><option value="monthly"${monthly?' selected':''}>${tr('payTypeMonthly')}</option></select></label>
    <div class="pgrid">${monthly?num(tr('payBase'),'base',P.base)+num(tr('payDayH'),'dayH',P.dayH,'0.5')+num(`${tr('payFund')}, ${H} · ${monthLabel(cur)}`,'fund.'+ym,P.fund[ym]||'','1',nf(C.fund)):num(tr('payRate'),'rate',P.rate)}</div>`;
  const g2=`<div class="muted">${tr('payPremH')} — ${tr('payPremHint')}</div><div class="pgrid">${prem('night','payNight')}${prem('sat','paySat')}${prem('sun','paySun')}${prem('hol','payHol')}</div>
    <div class="pgrid">${num(tr('payOtPct'),'otPct',P.otPct,'1')}</div>`;
  let g3=`<div class="pgrid">${num(tr('payTaxRate'),'taxRate',P.taxRate,'0.5')}`;
  if(st&&!monthly)g3+=num(tr('payDeduct'),'deduct',P.deduct)+num(`${tr('payOfficial')}, ${H}`,'official.'+ym,P.official[ym]||'','0.5');
  else if(st)g3+=num(tr('payDeduct'),'deduct',P.deduct);
  else g3+=num(tr('payTaxFree'),'taxFree',P.taxFree)+num(tr('payChild'),'childBonus',P.childBonus)+num(tr('payDeduct'),'deduct',P.deduct);
  g3+=`</div><div class="muted" style="margin-top:12px">${tr('payContribRates')}</div><div class="pgrid">${P.contrib.map(([n,p],i)=>num(n+', %',`contrib.${i}.1`,p,'0.1')).join('')}</div>`;
  const g4=st?'':`<div class="pgrid">${num(tr('payVacH'),'vacH',P.vacH,'0.5')}${num(tr('payPgH'),'pgH',P.pgH,'0.5')}</div>
    <div class="muted" style="margin-top:12px">${tr('payAvgHint')}</div>
    <div class="pgrid">${num(tr('payAvgNah'),'avgNah',P.avgNah,'0.0001',fx(C.hr))}${num(tr('payAvgNem'),'avgNem',P.avgNem,'0.0001',fx(C.hr))}${num(tr('payNem1'),'nem1',P.nem1,'1')}${num(tr('payNem2'),'nem2',P.nem2,'1')}</div>`;
  const g5=`<div class="muted">${tr('payBonusHint')}</div>`+
    P.bonus.map((b,i)=>`<div class="bonus"><input type="text" data-pf="bonus.${i}.n" data-str value="${esc(b.n||'')}" placeholder="${esc(tr('payBonusName'))}" maxlength="40">
      <input type="number" step="0.01" inputmode="decimal" data-pf="bonus.${i}.v" value="${b.v}">
      <select data-pf="bonus.${i}.u" data-str>${BU.map(([u,l])=>`<option value="${u}"${(b.u||'€')===u?' selected':''}>${tr(l)}</option>`).join('')}</select>
      <button class="icon danger" data-pbdel="${i}" aria-label="${tr('remove')}">✕</button></div>`).join('')+
    `<div class="row" style="margin-top:8px"><button data-pbadd>+ ${tr('payBonusAdd')}</button></div>
     <div class="pgrid">${num(`${tr('payExtra')} · ${monthLabel(cur)}`,'extra.'+ym,P.extra[ym]||'')}</div>`;
  const learn=`<div class="muted">${tr('payLearnHint')}</div>
    <div class="pgrid">${[['payG','payG'],['payB','payB'],['payO','payO'],['payT','payT'],['payN','payN']].map(([id,l])=>`<label class="f"><span>${tr(l)}</span><input type="number" step="0.01" inputmode="decimal" id="${id}"></label>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button data-plearn>${tr('payLearnBtn')}</button></div>
    <div class="muted" id="payLearnRes" style="margin-top:8px"></div>`;
  box.innerHTML=head(tr('payTitle'))+`
    <div class="paymon"><button class="icon" data-pm="-1" aria-label="${tr('prev')}">‹</button><span>${monthLabel(cur)}</span><button class="icon" data-pm="1" aria-label="${tr('next')}">›</button></div>
    <div class="paybig"><small>${tr('payNet')}</small><b>≈ ${fx(C.net)} €</b></div>
    <div>${r}</div>${split}
    ${st?`<div class="muted" style="margin-top:8px">${tr('payStudentNote')}</div>`:''}
    <div class="sec"><h3>${tr('payCheck')}</h3><div class="muted">${tr('payCheckHint')}</div>
      <div class="row" style="margin-top:8px"><input type="number" id="payActual" step="0.01" inputmode="decimal" placeholder="${fx(C.net0)}" style="width:130px">
        <button data-pcheck>${tr('payCheckApply')}</button>${P.calib!==1?`<button class="ghost" data-pcalreset>${tr('payCalibReset')}</button>`:''}</div>
      <div class="muted" id="payCheckRes" style="margin-top:6px"></div></div>
    <div class="sec"><h3>${tr('paySettings')}</h3>${grp('basic',tr('payGrpBasic'),g1)}${grp('prem',tr('payGrpPrem'),g2)}${grp('tax',tr('payGrpTax'),g3)}${st?'':grp('leave',tr('payGrpLeave'),g4)}${grp('bonus',tr('payBonuses'),g5)}${grp('learn',tr('payLearn'),learn)}</div>
    <div class="muted" style="margin-top:12px">${tr('payFootnote')}</div>
    <div class="foot"><button data-pchange>${tr('payChange')}</button><button class="primary" data-close>${tr('done')}</button></div>`;
}
$('payBody').addEventListener('toggle',e=>{const g=e.target.dataset&&e.target.dataset.g;if(g){if(e.target.open)payOpenSet.add(g);else payOpenSet.delete(g)}},true);
$('payBody').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.pmode){
    if(d.pmode==='none'){snap();S.pay={mode:'none'};save();render();closeDlg($('payDlg'));return}
    payDraft={mode:d.pmode,type:'hourly'};payStep='rate';renderPay();
  }
  else if(d.ptype){   // переключатель «почасовая / оклад» в мастере: меняем подписи, поле не сбрасываем
    payDraft.type=d.ptype;
    b.parentElement.querySelectorAll('button').forEach(o=>o.classList.toggle('on',o===b));
    const m=d.ptype==='monthly';
    $('payRateLbl').textContent=tr(m?'payBase':'payRate');$('payRateHint').textContent=tr(m?'payBaseHint':'payRateHint');
    $('payRateIn').placeholder=m?'1200':'6,50';
  }
  else if('pback' in d){payStep='mode';renderPay()}
  else if('psave' in d){
    const v=parseFloat(String($('payRateIn').value).replace(',','.'));
    if(!(v>0)){$('payRateIn').focus();return}
    snap();S.pay=payDefaults(payDraft.mode,v,payDraft.type);payStep=null;done(tr('paySaved'));renderPay();
  }
  else if(d.pm){cur.setMonth(cur.getMonth()+ +d.pm);render();renderPay()}
  else if('pchange' in d){payStep='mode';renderPay()}
  else if('pcheck' in d){
    const a=parseFloat(String($('payActual').value).replace(',','.')),C=payCalc(monthKey(),S.pay);
    if(!(a>0)||!(C.net0>0))return;
    snap();S.pay.calib=Math.max(.5,Math.min(1.5,a/C.net0));done(tr('paySaved'));renderPay();
  }
  else if('pcalreset' in d){snap();S.pay.calib=1;done(tr('paySaved'));renderPay()}
  else if('pbadd' in d){snap();S.pay.bonus.push({n:'',v:0,u:'€'});payOpenSet.add('bonus');done(tr('paySaved'));renderPay()}
  else if(d.pbdel!==undefined){snap();S.pay.bonus.splice(+d.pbdel,1);payOpenSet.add('bonus');done(tr('paySaved'));renderPay()}
  else if('plearn' in d){
    const g=id=>parseFloat(String($(id).value).replace(',','.'))||0;
    payProposal=learnFromSlip(g('payG'),g('payB'),g('payO'),g('payT'),g('payN'),S.pay);
    const p=payProposal,res=$('payLearnRes');
    if(p.deduct===undefined||(p.contribRate===undefined&&p.taxRate===undefined)){res.textContent=tr('payLearnNeed');payProposal=null;return}
    res.innerHTML=`${esc(tr('payLearnRes',{d:fx(p.deduct),c:String(p.contribRate??'—').replace('.',','),t:String(p.taxRate??'—').replace('.',',')}))} <button class="primary" data-papply style="margin-top:8px">${tr('payApply')}</button>`;
  }
  else if('papply' in d&&payProposal){
    snap();const p=payProposal,P=S.pay;
    P.deduct=p.deduct;if(p.taxFree!==undefined)P.taxFree=p.taxFree;
    if(p.contribRate!==undefined&&!p.keepContrib)P.contrib=[['Odvody',p.contribRate]];
    if(p.taxRate!==undefined)P.taxRate=p.taxRate;
    payProposal=null;payOpenSet.add('basic');payOpenSet.add('tax');done(tr('paySaved'));renderPay();
  }
});
// разница с реальным листом считается на лету, пока вводите число
$('payBody').addEventListener('input',e=>{
  if(e.target.id!=='payActual')return;
  const a=parseFloat(String(e.target.value).replace(',','.')),C=payCalc(monthKey(),S.pay);
  $('payCheckRes').textContent=a>0?tr('payCheckDiff',{d:fx(C.net-a)}):'';
});
// настройки: путь в data-pf, например prem.sat.v или contrib.0.1
$('payBody').addEventListener('change',e=>{
  const t=e.target,pf=t.dataset.pf;if(!pf||!S.pay)return;
  const v=parseFloat(String(t.value).replace(',','.')),val=t.dataset.str!==undefined?t.value:(isNaN(v)?0:v);
  snap();
  const parts=pf.split('.');let o=S.pay;
  for(let i=0;i<parts.length-1;i++)o=o[parts[i]]??(o[parts[i]]={});
  const last=parts[parts.length-1];
  if((parts[0]==='official'||parts[0]==='fund'||parts[0]==='extra')&&!val)delete o[last];else o[last]=val;
  done(tr('paySaved'));renderPay();
});
// закрыли первое окно, ничего не выбрав — больше не спрашиваем (кнопка остаётся в меню)
$('payDlg').addEventListener('close',()=>{if(!S.pay){S.pay={mode:'none'};save()}payStep=null});

/* ---------- окно выбора языка ---------- */
// Выбор отмечается галочкой, интерфейс плавно переключается, окно закрывается само.
const renderLang=()=>$('langDlg').open?smooth(renderLangNow,$('langBody')):renderLangNow();
function renderLangNow(){
  $('langBody').innerHTML=`<div class="dhead"><h2>${tr('language')}</h2><button class="icon ghost" data-close aria-label="${tr('close')}">✕</button></div>
    <div class="langlist">${LANGS.map(([c,n,en])=>`<button class="lrow${c===LANG?' on':''}" data-lang="${c}"><span class="lcode">${c.toUpperCase()}</span>
      <span class="lname"><b>${n}</b><small>${en}</small></span><span class="lck">✓</span></button>`).join('')}</div>`;
}
function openLangDlg(){renderLangNow();openDlg($('langDlg'))}
$('langBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]');if(!b)return;
  setLang(b.dataset.lang);
  setTimeout(()=>closeDlg($('langDlg')),340);
});

/* ---------- инструкция для новых пользователей ---------- */
// Показывается один раз при первом запуске (если в календаре ещё нет смен) и всегда доступна в меню.
const HELP_KEY='shiftcal.help',HELP_STEPS=5;
let helpStep=0;
const isStandalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;
const platform=()=>{
  const ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))return'ios';
  return /Android/.test(ua)?'and':'pc';
};
// картинка к шагу собрана из тех же элементов, что и приложение
function helpArt(i){
  const C={d:'#e08a00',n:'#4f46e5',o:'#10b981'},T=L().types;
  const disc=(k,cls)=>`<span class="disc ${cls}" style="--c:${C[k]};--ink:#fff">${esc(T[k][1])}</span>`;
  const solid=['d','d','n','n','o','o','o','o'].map(k=>disc(k,k==='o'?'off':'on')).join('');
  const plan=['d','d','n','n'].map(k=>disc(k,'on auto')).join('');
  if(i===0)return solid+'<span class="arr">→</span>'+plan;
  if(i===1)return['d','n','o'].map(k=>`<span class="cat" style="--c:${C[k]}"><b>${esc(T[k][1])}</b>${esc(T[k][0])}</span>`).join('');
  if(i===2)return`<span class="btnlike">${tr('build')}</span><span class="arr">→</span>`+plan;
  if(i===3)return`<span class="pill"><i style="background:#ec4899"></i>${esc(T.v[0])} <span>${tr('left')}</span><b>17</b><span>/ 20</span></span>
    <span class="pill"><i style="background:var(--accent)"></i>${tr('payTitle')} <span>≈</span><b>577 €</b></span>`;
  return'<img src="icon-192.png" alt="">';
}
const renderHelp=()=>$('helpDlg').open?smooth(renderHelpNow,$('helpBody')):renderHelpNow();
function renderHelpNow(){
  const i=helpStep,last=i===HELP_STEPS-1;
  const body=last?(isStandalone()?'':tr('hlp5b_'+platform())+' ')+tr('hlp5b'):tr('hlp'+(i+1)+'b');
  $('helpBody').innerHTML=`
    <div class="hlang"><button data-hlangdlg>🌐 ${LANGS.find(l=>l[0]===LANG)[1]} ▾</button></div>
    <div class="hart">${helpArt(i)}</div>
    <h2 class="htitle">${tr('hlp'+(i+1)+'t')}</h2><p class="hbody">${body}</p>
    <div class="hdots">${Array.from({length:HELP_STEPS},(_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <div class="foot">${i?`<button data-hback>${tr('helpBack')}</button>`:`<button data-hskip>${tr('helpSkip')}</button>`}<button class="primary" data-hnext>${tr(last?'helpStart':'helpNext')}</button></div>`;
}
function openHelp(){helpStep=0;renderHelpNow();openDlg($('helpDlg'))}
$('helpBody').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if('hlangdlg' in d)openLangDlg();
  else if('hskip' in d)closeDlg($('helpDlg'));
  else if('hback' in d){helpStep=Math.max(0,helpStep-1);renderHelp()}
  else if('hnext' in d){if(helpStep>=HELP_STEPS-1)closeDlg($('helpDlg'));else{helpStep++;renderHelp()}}
});
// после инструкции — выбор режима зарплаты
$('helpDlg').addEventListener('close',()=>{
  try{localStorage.setItem(HELP_KEY,'1')}catch{}
  if(!S.pay)setTimeout(()=>{if(!document.querySelector('dialog[open]'))openPay('mode')},250);
});

paintTheme(document.documentElement.dataset.mode);
applyStatic();
render();
checkReminders();setInterval(checkReminders,60000);
// первый запуск: сначала инструкция (только если смен ещё нет), потом выбор режима зарплаты
let showHelp=false;
try{if(localStorage.getItem(HELP_KEY)!=='1'){if(!Object.keys(S.days).length)showHelp=true;else localStorage.setItem(HELP_KEY,'1')}}catch{}
if(showHelp)setTimeout(openHelp,600);
else if(!S.pay)setTimeout(()=>{if(!document.querySelector('dialog[open]'))openPay('mode')},700);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  // новая версия взяла управление — перезагружаемся один раз, чтобы сразу её показать
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
}
</script>
</body>
</html>
